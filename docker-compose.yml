services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sql_practice
    ports:
      - "5432:5432"
    volumes:
      - sql_practice_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sql_practice"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sql_practice_pg:
